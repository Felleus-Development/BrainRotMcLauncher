name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          sudo apt-get update && sudo apt-get install -y wget
          cd app_pojavlauncher/libs
          wget -q https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Get JRE17 from artifacts (with fallback)
        id: get-jre17
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-new
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre17-pojav
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Get JRE21 from artifacts (with fallback)
        id: get-jre21
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-21
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre21-pojav
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Download JREs from releases (fallback)
        if: steps.get-jre17.outcome == 'failure' || steps.get-jre21.outcome == 'failure'
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-new
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-21
          cd app_pojavlauncher/src/main/assets/components
          wget -q -O jre-new/jre17.zip "https://github.com/AngelAuraMC/angelauramc-openjdk-build/releases/download/latest/jre17-pojav.zip" || echo "JRE17 release not found"
          wget -q -O jre-21/jre21.zip "https://github.com/AngelAuraMC/angelauramc-openjdk-build/releases/download/latest/jre21-pojav.zip" || echo "JRE21 release not found"
          unzip -q jre-new/jre17.zip -d jre-new/ 2>/dev/null || true
          unzip -q jre-21/jre21.zip -d jre-21/ 2>/dev/null || true

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh

          mkdir out
          # Build JRE JAR files (security manager, etc...)
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug .apk
        run: |
          # Build the launcher
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/BrainRotsMc.apk

      - name: Build APK without runtime
        run: |
          rm -rf app_pojavlauncher/src/main/assets/components/jre
          rm -rf app_pojavlauncher/src/main/assets/components/jre-new
          rm -rf app_pojavlauncher/src/main/assets/components/jre-21
          gradle assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/BrainRotsMc-noruntime.apk
      - name: Gen md5sums
        run: |
          md5sum out/BrainRotsMc.apk > out/BrainRotsMc.md5
          md5sum out/BrainRotsMc-noruntime.apk > out/BrainRotsMc-noruntime.md5

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: BrainRotsMc
          path: out/BrainRotsMc.*

      - name: Upload APK (without runtime)
        uses: actions/upload-artifact@v6
        with:
          name: BrainRotsMc-noruntime
          path: out/BrainRotsMc-noruntime.*

