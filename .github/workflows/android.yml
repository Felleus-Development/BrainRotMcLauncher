name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y wget unzip

      - name: Get LTW
        run: |
          cd app_pojavlauncher/libs
          wget -q https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Get JRE17
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-new
          cd app_pojavlauncher/src/main/assets/components/jre-new
          # Try to download from releases API (latest)
          RELEASE_URL=$(wget -qO- "https://api.github.com/repos/AngelAuraMC/angelauramc-openjdk-build/releases/latest" | grep -o '"browser_download_url": "[^"]*jre17[^"]*\.zip"' | head -1 | sed 's/.*"browser_download_url": "\(.*\)"/\1/')
          if [ -n "$RELEASE_URL" ]; then
            echo "Downloading JRE17 from: $RELEASE_URL"
            wget -q --timeout=60 -O jre17.zip "$RELEASE_URL" && unzip -q jre17.zip && rm jre17.zip && echo "JRE17 downloaded successfully"
          else
            echo "No JRE17 release found, will try artifact download"
          fi
        continue-on-error: true

      - name: Get JRE21
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-21
          cd app_pojavlauncher/src/main/assets/components/jre-21
          # Try to download from releases API (latest)
          RELEASE_URL=$(wget -qO- "https://api.github.com/repos/AngelAuraMC/angelauramc-openjdk-build/releases/latest" | grep -o '"browser_download_url": "[^"]*jre21[^"]*\.zip"' | head -1 | sed 's/.*"browser_download_url": "\(.*\)"/\1/')
          if [ -n "$RELEASE_URL" ]; then
            echo "Downloading JRE21 from: $RELEASE_URL"
            wget -q --timeout=60 -O jre21.zip "$RELEASE_URL" && unzip -q jre21.zip && rm jre21.zip && echo "JRE21 downloaded successfully"
          else
            echo "No JRE21 release found, will try artifact download"
          fi
        continue-on-error: true

      - name: Get JRE17 from artifacts (backup)
        if: always()
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-new
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre17-pojav
          if_no_artifact_found: ignore
        continue-on-error: true

      - name: Get JRE21 from artifacts (backup)
        if: always()
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-21
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre21-pojav
          if_no_artifact_found: ignore
        continue-on-error: true

      - name: Verify JRE components
        run: |
          echo "=== Checking JRE components ==="
          ls -la app_pojavlauncher/src/main/assets/components/ || echo "components dir not found"
          ls -la app_pojavlauncher/src/main/assets/components/jre-new/ 2>/dev/null || echo "JRE17 dir empty/missing"
          ls -la app_pojavlauncher/src/main/assets/components/jre-21/ 2>/dev/null || echo "JRE21 dir empty/missing"
          echo "================================"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh

          mkdir out
          # Build JRE JAR files (security manager, etc...)
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug .apk
        run: |
          # Build the launcher
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/BrainRotsMc.apk

      - name: Build APK without runtime
        run: |
          rm -rf app_pojavlauncher/src/main/assets/components/jre
          rm -rf app_pojavlauncher/src/main/assets/components/jre-new
          rm -rf app_pojavlauncher/src/main/assets/components/jre-21
          gradle assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/BrainRotsMc-noruntime.apk
      - name: Gen md5sums
        run: |
          md5sum out/BrainRotsMc.apk > out/BrainRotsMc.md5
          md5sum out/BrainRotsMc-noruntime.apk > out/BrainRotsMc-noruntime.md5

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: BrainRotsMc
          path: out/BrainRotsMc.*

      - name: Upload APK (without runtime)
        uses: actions/upload-artifact@v6
        with:
          name: BrainRotsMc-noruntime
          path: out/BrainRotsMc-noruntime.*

