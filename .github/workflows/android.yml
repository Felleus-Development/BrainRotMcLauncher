name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          apt update && apt install wget
          cd app_pojavlauncher/libs
          wget https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Get JRE21
        if: hashFiles('app_pojavlauncher/src/main/assets/components/jre-21/version') == ''
        uses: dawidd6/action-download-artifact@v21
        continue-on-error: true
        id: get_jre21
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-21
          workflow_conclusion: success
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre21-pojav

      - name: Verify JRE21
        run: |
          if [ -f app_pojavlauncher/src/main/assets/components/jre-21/version ]; then
            echo "JRE21 ready (vendored or downloaded)."
            exit 0
          fi
          echo "::error::JRE21 missing. GitHub Actions artifacts expire after 90 days."
          echo "Fix (pick one):"
          echo "  1) Re-run https://github.com/AngelAuraMC/angelauramc-openjdk-build/actions (branch buildjre17-21, ~3h), then re-run this workflow."
          echo "  2) Download jre21-pojav from a successful run Artifacts section, unzip into app_pojavlauncher/src/main/assets/components/jre-21/ and commit."
          exit 1

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh

          mkdir out
          # Build JRE JAR files (security manager, etc...)
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug .apk
        run: |
          # Build the launcher
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/BrainRotsMc.apk

      - name: Build APK without runtime
        run: |
          rm -rf app_pojavlauncher/src/main/assets/components/jre-21
          gradle assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/BrainRotsMc-noruntime.apk
      - name: Gen md5sums
        run: |
          md5sum out/BrainRotsMc.apk > out/BrainRotsMc.md5
          md5sum out/BrainRotsMc-noruntime.apk > out/BrainRotsMc-noruntime.md5

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: BrainRotsMc
          path: out/BrainRotsMc.*

      - name: Upload APK (without runtime)
        uses: actions/upload-artifact@v6
        with:
          name: BrainRotsMc-noruntime
          path: out/BrainRotsMc-noruntime.*

